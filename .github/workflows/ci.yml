name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Vet
        run: go vet ./...
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test -race ./...

  release:
    name: Release binaries (${{ matrix.goos }}/${{ matrix.goarch }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p out
          EXT=""
          [ "$GOOS" = "windows" ] && EXT=".exe"
          go build -trimpath -ldflags "-s -w" -o "out/github-image-push-${GOOS}-${GOARCH}${EXT}" .
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
      - name: Upload linux binaries to Gitee release（国内加速）
        if: startsWith(matrix.goos, 'linux')
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          BASE="https://gitee.com/api/v5/repos/jeckchen666/GithubImagePush"
          RID=$(curl -s -X POST "$BASE/releases" \
            -d "access_token=$GITEE_TOKEN" -d "tag_name=${GITHUB_REF_NAME}" \
            -d "target_commitish=main" -d "name=GithubImagePush ${GITHUB_REF_NAME}" \
            -d "body=Linux 二进制见附件；其他平台请到 GitHub Releases 下载" \
            | grep -m1 '"id"' | grep -o '[0-9]\+' || true)
          if [ -z "$RID" ]; then
            RID=$(curl -s -H "Authorization: token $GITEE_TOKEN" \
              "$BASE/releases/tags/${GITHUB_REF_NAME}" | grep -m1 '"id"' | grep -o '[0-9]\+')
          fi
          echo "Gitee release id: $RID"
          curl -s -X POST "$BASE/releases/$RID/attach_files" \
            -F "access_token=$GITEE_TOKEN" -F "file=@out/github-image-push-linux-${{ matrix.goarch }}" >/dev/null

  sync-gitee:
    name: Mirror to Gitee
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push main and tags to Gitee
        run: |
          git remote add gitee "https://oauth2:${{ secrets.GITEE_TOKEN }}@gitee.com/jeckchen666/GithubImagePush.git"
          git push gitee origin/main:refs/heads/main --force
          git push gitee origin --tags --force
