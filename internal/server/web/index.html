<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <title>GithubImagePush · GitHub 图床</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <svg class="logo" viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
          <path fill="currentColor" d="M12 2C6.48 2 2 6.58 2 12.25c0 4.53 2.87 8.37 6.84 9.72.5.1.68-.22.68-.49 0-.24-.01-.87-.01-1.7-2.78.62-3.37-1.37-3.37-1.37-.45-1.18-1.11-1.5-1.11-1.5-.91-.64.07-.62.07-.62 1 .07 1.53 1.06 1.53 1.06.9 1.57 2.35 1.12 2.92.85.09-.66.35-1.12.63-1.37-2.22-.26-4.56-1.14-4.56-5.07 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.3.1-2.7 0 0 .84-.28 2.75 1.05a9.3 9.3 0 0 1 5 0c1.91-1.33 2.75-1.05 2.75-1.05.55 1.4.2 2.44.1 2.7.64.72 1.03 1.63 1.03 2.75 0 3.94-2.34 4.8-4.57 5.06.36.32.68.94.68 1.9 0 1.37-.01 2.47-.01 2.81 0 .27.18.6.69.49A10.25 10.25 0 0 0 22 12.25C22 6.58 17.52 2 12 2Z"/>
          <image href="/favicon.svg" x="13" y="13" width="11" height="11"/>
        </svg>
        <div>
          <h1>GithubImagePush</h1>
          <p class="subtitle">GitHub 图床 · 图片转链接</p>
        </div>
      </div>

      <div class="auth-box" id="authBox">
        <!-- 未鉴权：输入 Key -->
        <div class="auth-form" id="authForm">
          <input type="password" id="keyInput" placeholder="输入访问 Key…" autocomplete="off" spellcheck="false" />
          <button class="btn primary" id="saveKeyBtn">验证并保存</button>
        </div>
        <!-- 已鉴权：状态 -->
        <div class="auth-ok hidden" id="authOk">
          <span class="chip ok" id="authChip">已鉴权</span>
          <button class="btn ghost small" id="logoutBtn" title="清除本地保存的 Key">退出</button>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- 服务端配置未就绪提示 -->
    <div class="alert warn hidden" id="cfgAlert"></div>

    <nav class="tabs">
      <button class="tab active" data-tab="upload">上传</button>
      <button class="tab" data-tab="gallery">图库</button>
    </nav>

    <!-- ============ 上传 ============ -->
    <section id="tab-upload" class="tabpanel">
      <div class="card dropzone" id="dropzone" tabindex="0" role="button" aria-label="选择或拖拽图片上传">
        <svg viewBox="0 0 24 24" width="46" height="46" aria-hidden="true">
          <path fill="currentColor" d="M5 4h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Zm0 2v9.5l4-4 3.5 3.5L16 9l3 3V6H5Zm3 1.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3Z"/>
        </svg>
        <p class="dz-main">点击选择、拖拽图片到此处，或 <kbd>Ctrl</kbd>+<kbd>V</kbd> 粘贴截图</p>
        <p class="dz-sub" id="dzHint">支持多选 · 上传后自动生成多种格式链接</p>
        <input type="file" id="fileInput" multiple accept="image/*" hidden />
      </div>

      <div id="uploadList" class="upload-list"></div>
    </section>

    <!-- ============ 图库 ============ -->
    <section id="tab-gallery" class="tabpanel hidden">
      <div class="gallery-toolbar">
        <div class="breadcrumb" id="breadcrumb"></div>
        <button class="btn ghost" id="refreshBtn">
          <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7Z"/></svg>
          刷新
        </button>
      </div>
      <div class="gallery-grid" id="galleryGrid"></div>
      <div class="empty hidden" id="galleryEmpty">此目录暂无内容</div>
    </section>
  </main>

  <!-- 图片详情弹层 -->
  <div class="modal hidden" id="detailModal">
    <div class="modal-backdrop" data-close="1"></div>
    <div class="modal-card">
      <button class="modal-close" data-close="1" aria-label="关闭">✕</button>
      <div class="modal-preview" id="detailPreview"></div>
      <div class="modal-info">
        <h3 id="detailName"></h3>
        <p class="muted" id="detailMeta"></p>
        <div class="link-rows" id="detailLinks"></div>
        <div class="modal-actions">
          <a class="btn ghost" id="detailOpen" target="_blank" rel="noopener">在 GitHub 打开</a>
          <button class="btn danger" id="detailDelete">删除此文件</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-wrap" id="toastWrap"></div>

  <footer class="footer">
    <span>GithubImagePush · 参考 <a href="https://github.com/Molunerfinn/PicGo" target="_blank" rel="noopener">PicGo</a> 的 GitHub 图床实现</span>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
